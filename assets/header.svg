<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-label="Khutso Sekele, Software Engineer in Progress" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Card -->
  <rect x="2" y="2" width="996" height="676" rx="28" fill="#101813" stroke="#223229" stroke-width="2"/>

  <!-- Status pill -->
  <rect x="40" y="40" width="250" height="46" rx="23" fill="#17301f"/>
  <circle class="pulse" cx="66" cy="63" r="6" fill="#4ec26a"/>
  <text class="sans" x="84" y="70" font-size="20" letter-spacing="1.5" fill="#4ec26a">SYSTEM ONLINE</text>

  <!-- Handle -->
  <text class="sans" x="960" y="70" font-size="22" letter-spacing="1.5" fill="#8a948f" text-anchor="end">MOGAPIS / DEVELOPER</text>

  <!-- Name + tagline -->
  <text class="sans" x="40" y="172" font-size="68" font-weight="700" fill="#eaf6ee">Khutso Sekele</text>
  <text class="sans" x="40" y="238" font-size="36" fill="#6ee08a">Software Engineer in Progress.</text>

  <!-- Description -->
  <text class="sans" x="40" y="298" font-size="25" fill="#aab4af">Exploring systems programming, C++, full-stack</text>
  <text class="sans" x="40" y="334" font-size="25" fill="#aab4af">engineering and artificial intelligence.</text>

  <line x1="40" y1="372" x2="960" y2="372" stroke="#26372d" stroke-width="2"/>

  <!-- whoami -->
  <text class="mono" x="40" y="424" font-size="26" fill="#6ee08a">root@mogapis:~$ whoami</text>
  <text class="sans" x="40" y="468" font-size="23" fill="#dfe9e3">Computer Science student · Software developer · Problem solver</text>

  <!-- interests -->
  <text class="mono" x="40" y="528" font-size="26" fill="#6ee08a">root@mogapis:~$ interests</text>
  <rect class="blink" x="446" y="506" width="14" height="28" fill="#6ee08a"/>

  <!-- Interest pills -->
  <g class="sans" font-size="21" fill="#4ec26a" text-anchor="middle">
    <rect x="40"  y="552" width="100" height="46" rx="23" fill="#17301f"/>
    <text x="90"  y="582">C++</text>
    <rect x="154" y="552" width="140" height="46" rx="23" fill="#17301f"/>
    <text x="224" y="582">Systems</text>
    <rect x="308" y="552" width="150" height="46" rx="23" fill="#17301f"/>
    <text x="383" y="582">Full-stack</text>
    <rect x="472" y="552" width="130" height="46" rx="23" fill="#17301f"/>
    <text x="537" y="582">AI / ML</text>
  </g>

  <line x1="40" y1="624" x2="960" y2="624" stroke="#26372d" stroke-width="2"/>

  <!-- Footer -->
  <text class="sans" x="40" y="660" font-size="20" letter-spacing="2" fill="#8a948f">BUILDING · LEARNING · EXPERIMENTING</text>

  <!-- Terminal icon -->
  <rect x="914" y="636" width="46" height="34" rx="8" fill="none" stroke="#4ec26a" stroke-width="3"/>
  <path d="M926 645 L936 653 L926 661" fill="none" stroke="#4ec26a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="941" y1="661" x2="950" y2="661" stroke="#4ec26a" stroke-width="3" stroke-linecap="round"/>
</svg>
